name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint and format
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit, integration and SQL reconciliation tests
        run: npm test
      - name: Generated documentation is up to date
        run: npm run docs:check
      - name: Install browser for end-to-end tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests against the production build
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build the image (runs the SQL suite and its reconciliation checks)
        run: docker build -t pure-insights-command-centre:ci .
      - name: Start it and wait for readiness
        run: |
          docker run -d --name cc -p 4000:4000 pure-insights-command-centre:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:4000/readyz && exit 0; sleep 1; done
          docker logs cc; exit 1
