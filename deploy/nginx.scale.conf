# Load balancer for the scale-out stack (docker-compose.scale.yml).
#
# One rule: the two real-time paths go to the edge tier, everything else to the core.
# `edge` resolves to every edge replica; nginx round-robins between them.

upstream core {
    server core:4000;
}

upstream edge {
    # After one failed attempt an edge is skipped for a while, so a dead node costs one
    # client one short wait rather than every client a long one.
    server edge:4000 max_fails=1 fail_timeout=15s;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # WebSocket.
    location = /ws {
        proxy_pass http://edge;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Host with its port: the edge compares it with Origin to accept same-origin pages.
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # An edge that has gone does not refuse the connection, it just never answers.
        proxy_connect_timeout 2s;
    }

    # Server-Sent Events: a long response that must not be buffered.
    location = /api/v1/stream {
        proxy_pass http://edge;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_connect_timeout 2s;
    }

    location / {
        proxy_pass http://core;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # While the core restarts, answer quickly instead of hanging.
        proxy_connect_timeout 2s;
    }
}
