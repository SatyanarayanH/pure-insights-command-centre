<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 560" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13">
  <title>Pure Insights Command Centre architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#52514e"/>
    </marker>
  </defs>
  <rect width="980" height="560" fill="#fcfcfb"/>

  <!-- external actors -->
  <rect x="24" y="64" width="190" height="96" rx="10" fill="#fcfcfb" stroke="#898781" stroke-dasharray="5 4"/>
  <text x="119" y="100" text-anchor="middle" font-weight="600" fill="#0b0b0b">Pure Insights portal</text>
  <text x="119" y="120" text-anchor="middle" fill="#52514e">emits one event per</text>
  <text x="119" y="137" text-anchor="middle" fill="#52514e">dashboard load / refresh</text>

  <rect x="766" y="64" width="190" height="96" rx="10" fill="#e6f0fc" stroke="#2a78d6"/>
  <text x="861" y="100" text-anchor="middle" font-weight="600" fill="#0b0b0b">React web app</text>
  <text x="861" y="120" text-anchor="middle" fill="#52514e">role-aware navigation</text>
  <text x="861" y="137" text-anchor="middle" fill="#52514e">live alert feed</text>

  <!-- API process -->
  <rect x="270" y="28" width="440" height="330" rx="12" fill="#f1f0ec" stroke="#c3c2b7"/>
  <text x="290" y="52" font-weight="600" fill="#0b0b0b">API process (Node.js, Express)</text>

  <rect x="290" y="66" width="400" height="58" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="306" y="90" font-weight="600" fill="#0b0b0b">REST API  /api/v1</text>
  <text x="306" y="109" fill="#52514e">route registry: validate, authorise, respond, document</text>

  <rect x="290" y="136" width="400" height="58" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="306" y="160" font-weight="600" fill="#0b0b0b">Telemetry pipeline and alert engine</text>
  <text x="306" y="179" fill="#52514e">state update, rule evaluation, lifecycle, one transaction</text>

  <rect x="290" y="206" width="400" height="58" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="306" y="230" font-weight="600" fill="#0b0b0b">Event bus</text>
  <text x="306" y="249" fill="#52514e">monotonic event ids, bounded replay buffer</text>

  <rect x="290" y="276" width="400" height="66" rx="8" fill="#fcfcfb" stroke="#c3c2b7"/>
  <text x="306" y="300" font-weight="600" fill="#0b0b0b">Real-time gateway  /ws  and  /api/v1/stream</text>
  <text x="306" y="319" fill="#52514e">ticket auth, per-recipient row and field security,</text>
  <text x="306" y="334" fill="#52514e">resume by event id, heartbeat</text>

  <line x1="490" y1="194" x2="490" y2="205" stroke="#52514e" marker-end="url(#arrow)"/>
  <line x1="490" y1="264" x2="490" y2="275" stroke="#52514e" marker-end="url(#arrow)"/>
  <line x1="490" y1="124" x2="490" y2="135" stroke="#52514e" marker-end="url(#arrow)"/>

  <!-- portal -> API -->
  <path d="M214 112 H246 V165 H289" fill="none" stroke="#52514e" marker-end="url(#arrow)"/>
  <text x="119" y="186" text-anchor="middle" fill="#52514e" font-size="12">POST /api/v1/telemetry</text>
  <text x="119" y="202" text-anchor="middle" fill="#52514e" font-size="12">X-API-Key</text>

  <!-- browser <-> API -->
  <line x1="765" y1="95" x2="691" y2="95" stroke="#52514e" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="728" y="86" text-anchor="middle" fill="#52514e" font-size="12">REST</text>
  <path d="M690 309 H861 V161" fill="none" stroke="#52514e" marker-end="url(#arrow)"/>
  <text x="776" y="300" text-anchor="middle" fill="#52514e" font-size="12">WebSocket / SSE events</text>

  <!-- stores -->
  <rect x="270" y="400" width="210" height="132" rx="10" fill="#fcfcfb" stroke="#eb6834"/>
  <text x="286" y="425" font-weight="600" fill="#0b0b0b">Operational store</text>
  <text x="286" y="446" fill="#52514e">SQLite locally</text>
  <text x="286" y="463" fill="#52514e">Postgres in production</text>
  <text x="286" y="487" fill="#52514e" font-size="12">users, sessions, alerts,</text>
  <text x="286" y="503" fill="#52514e" font-size="12">owner assignments, audit log</text>

  <rect x="500" y="400" width="456" height="132" rx="10" fill="#fcfcfb" stroke="#1baf7a"/>
  <text x="516" y="425" font-weight="600" fill="#0b0b0b">Warehouse</text>
  <text x="516" y="446" fill="#52514e">DuckDB locally, Snowflake in production: same SQL files</text>
  <g font-size="12">
    <rect x="516" y="462" width="72" height="50" rx="6" fill="#f1f0ec" stroke="#c3c2b7"/>
    <text x="552" y="484" text-anchor="middle" fill="#0b0b0b">RAW +</text>
    <text x="552" y="500" text-anchor="middle" fill="#52514e">usage logs</text>
    <rect x="606" y="462" width="72" height="50" rx="6" fill="#f1f0ec" stroke="#c3c2b7"/>
    <text x="642" y="491" text-anchor="middle" fill="#0b0b0b">STG</text>
    <rect x="696" y="462" width="72" height="50" rx="6" fill="#f1f0ec" stroke="#c3c2b7"/>
    <text x="732" y="484" text-anchor="middle" fill="#0b0b0b">DQ</text>
    <text x="732" y="500" text-anchor="middle" fill="#52514e">16 checks</text>
    <rect x="786" y="462" width="154" height="50" rx="6" fill="#f1f0ec" stroke="#c3c2b7"/>
    <text x="863" y="484" text-anchor="middle" fill="#0b0b0b">MART</text>
    <text x="863" y="500" text-anchor="middle" fill="#52514e">cost, ownership, anomalies</text>
    <line x1="588" y1="487" x2="605" y2="487" stroke="#52514e" marker-end="url(#arrow)"/>
    <line x1="678" y1="487" x2="695" y2="487" stroke="#52514e" marker-end="url(#arrow)"/>
    <line x1="768" y1="487" x2="785" y2="487" stroke="#52514e" marker-end="url(#arrow)"/>
  </g>

  <line x1="375" y1="358" x2="375" y2="399" stroke="#52514e" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="383" y="383" fill="#52514e" font-size="12">read / write</text>
  <line x1="620" y1="358" x2="620" y2="399" stroke="#52514e" marker-start="url(#arrow)"/>
  <text x="628" y="383" fill="#52514e" font-size="12">read marts at start, after reconciliation passes</text>
</svg>
